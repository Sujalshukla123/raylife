apiVersion: image.toolkit.fluxcd.io/v1beta1
kind: ImagePolicy
metadata:
  name: ray-gateway-service-internal-dev
spec:
  imageRepositoryRef:
    name: ray-gateway-service-internal
  filterTags:
    pattern: "^.+-dev-[a-fA-F0-9]+-[0-9]+-(?P<ts>.*)"
    extract: "$ts"
  policy:
    numerical:
      order: asc