apiVersion: apps/v1
kind: Deployment
metadata:
  name: jhipster-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jhipster-registry
  template:
    metadata:
      labels:
        app: jhipster-registry
    spec:
      imagePullSecrets:
      - name: regcred
      
      containers:
      - name: jhipster-registry
        image: nrvmodi/jhipster-registry-cloud-bus:v6.6.0.1
        env: 
          - name: "SPRING_CLOUD_CONFIG_SERVER_COMPOSITE_0_TYPE"
            value: native
          - name: "SPRING_CLOUD_CONFIG_SERVER_COMPOSITE_0_SEARCH_LOCATIONS"
            value: file:./central-config/localhost-config/
          - name: "KAFKA_SECURITY_PROTOCOL"
            value: SASL_PLAINTEXT
        envFrom:
        - configMapRef:
            name: common-cm
        ports:
        - containerPort: 80
