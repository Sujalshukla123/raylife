apiVersion: v1
kind: Service
metadata:
  name: ray-mqtt-proxy
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/management/prometheus"  
    prometheus.io/port: "metrics"
  labels:
    app.kubernetes.io/part-of: ray-mqtt-proxy-service
spec:
  type: NodePort
  selector:
    app: ray-mqtt-proxy
  ports:
    - protocol: TCP
      port: 38114
      targetPort: 38114
      nodePort: 32114
      name: "metrics"