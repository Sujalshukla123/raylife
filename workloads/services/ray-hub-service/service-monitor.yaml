apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ray-hub-service-monitor
  namespace: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: ray-hub-service 
  namespaceSelector:
    matchNames:
    - default
  endpoints:
  - port: "metrics"
    path: /management/prometheus  
    interval: 30s