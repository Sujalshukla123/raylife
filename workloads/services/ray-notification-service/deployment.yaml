apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ray-notification-service
  template:
    metadata:
      labels:
        app: ray-notification-service
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: ray-notification-service
          image: truecomtelesoftindia/ray-notification-service:8.0.0-SNAPSHOT-master-0f6731d-179 # {"$imagepolicy": "default:ray-notification-service"}
          livenessProbe:
            httpGet:
              path: /management/health
              port: 38087
            initialDelaySeconds: 600
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /management/health
              port: 38087
            initialDelaySeconds: 300
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: "6Gi"
              cpu: "300m"
            limits:
              memory: "6Gi"
              cpu: "300m"
          envFrom:
            - configMapRef:
                name: common-cm
          env:
            - name: SPRING_DATASOURCE_HOST
              value: postgres-postgresql.postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: pa8Gz+cLfAT4Yn3
            - name: SPRING_DATASOURCE_URL
              value: ${POSTGRES_DATASOURCE_URL}${SCHEMA_NAME_NOTIFICATION}${APPLICATION_NAME_NOTIFICATION}
            - name: SERVICE_DNS_NAME
              value: ray-notification-service-headless.default.svc.cluster.local
            - name: _JAVA_OPTIONS
              value: "-Xmx5120m -Xms4096m -XX:+UnlockExperimentalVMOptions -XX:+UseCGroupMemoryLimitForHeap -XX:MaxRAMFraction=1 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/home/heapdump.bin"
          ports:
            - containerPort: 38087
