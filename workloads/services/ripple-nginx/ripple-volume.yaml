apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ripple-volume
  finalizers:
    - kubernetes.io/pvc-protection
  labels: 
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/recurring-backups: enabled
    recurring-job-group.longhorn.io/backup: enabled
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 205Gi
  # volumeName: ripple-nginx-restore