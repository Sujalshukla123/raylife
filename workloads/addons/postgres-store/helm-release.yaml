apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: postgres-store
  namespace: postgres
spec:
  interval: 5m
  chart:
    spec:
      chart: postgresql
      version: '13.2.23'
      sourceRef:
        kind: HelmRepository
        name: bitnamicharts-store
        namespace: postgres
      interval: 1m
  values:
    auth:
      postgresPassword: "3g}*,cq{fT/AwTB5"
      database: raystore_prod
    primary:
      initdb:
        scripts:
          init.sql: |-
            CREATE USER "raystore" WITH PASSWORD 'pa8Gz+cLfAT4Yn3';
            CREATE USER "rdsadmin" WITH PASSWORD 'pa8Gz+cLfAT4Yn3';
            CREATE USER backup_user SUPERUSER  password 'mA7s#tY9pQ!xLd2V';
            ALTER USER backup_user set default_transaction_read_only = on;
        user: postgres
        password: "3g}*,cq{fT/AwTB5"
      priorityClassName: "high-priority"
      extendedConfiguration: |
        max_connections = 1000
      service:
        type: NodePort
      persistence:
        size: 50Gi
        labels: 
          recurring-job.longhorn.io/source: enabled
          recurring-job.longhorn.io/recurring-postgres-backups: enabled
          recurring-job-group.longhorn.io/postgres-backup: enabled
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          memory: 2Gi
          cpu: 2
    image:
      registry: docker.io
      repository: bitnami/postgresql
      tag: 11.22.0-debian-11-r4
      digest: ""
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        namespace: "monitoring"
      prometheusRule:
        enabled: true
        namespace: "monitoring"