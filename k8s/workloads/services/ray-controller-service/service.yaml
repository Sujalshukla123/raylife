apiVersion: v1
kind: Service
metadata:
  name: ray-controller-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/management/prometheus"  
    prometheus.io/port: "metrics"
  labels:
    app.kubernetes.io/part-of: ray-controller-service
spec:
  type: NodePort
  selector:
    app: ray-controller-service
  ports:
    - protocol: TCP
      port: 38081
      targetPort: 38081
      nodePort: 32081
      name: "metrics"